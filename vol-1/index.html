<style>
  :root{
    --void: #0b0a14;
    --void-deep: #060509;
    --ink: #f4f1fb;
    --ink-dim: #b9b3cf;
    --army: #8b6fd1;
    --army-glow: #b79cff;
    --gold: #d8b56c;

  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(139,111,209,0.25), transparent),
      var(--void);

    overflow-x:hidden;
  }

  /* starfield */
 .sky-feature{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    aspect-ratio: 1904/803;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .sky-feature svg{ width:100%; height:100%; display:block; }
  
  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 8% 12%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.5px 1.5px at 22% 28%, rgba(255,255,255,0.7), transparent),
      radial-gradient(2.2px 2.2px at 38% 8%, rgba(255,255,255,0.85), transparent),
      radial-gradient(1.5px 1.5px at 50% 35%, rgba(255,255,255,0.65), transparent),
      radial-gradient(2px 2px at 65% 18%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.5px 1.5px at 78% 42%, rgba(255,255,255,0.7), transparent),
      radial-gradient(2.4px 2.4px at 90% 10%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.5px 1.5px at 5% 55%, rgba(255,255,255,0.65), transparent),
      radial-gradient(2px 2px at 30% 65%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.6px 1.6px at 60% 72%, rgba(255,255,255,0.7), transparent),
      radial-gradient(2.3px 2.3px at 85% 60%, rgba(255,255,255,0.85), transparent),
      radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 45% 90%, rgba(255,255,255,0.75), transparent),
      radial-gradient(1.8px 1.8px at 72% 92%, rgba(255,255,255,0.7), transparent),
      radial-gradient(2.5px 2.5px at 95% 80%, rgba(255,255,255,0.9), transparent);
    background-size: 380px 420px;
    background-repeat: repeat;
    opacity:0.95;
  }

  header{
    position:relative; z-index:1;
    text-align:center;
    padding:4.5rem 1.5rem 2rem;
  }

  .eyebrow{
    font-family:'Futura','Century Gothic',sans-serif;
    letter-spacing:0.45em;
    font-size:0.7rem;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 1rem;
  }

  h1{
    font-size:clamp(2.6rem, 8vw, 5.2rem);
    margin:0;
    line-height:1;
    letter-spacing:0.03em;
    font-weight:400;
    color:#ffffff;
    text-shadow: 0 0 60px rgba(183,156,255,0.25);
  }

  .subtitle{
    font-family:'Futura','Century Gothic',sans-serif;
    font-size:0.95rem;
    letter-spacing:0.08em;
    color:var(--ink-dim);
    margin-top:0.9rem;
  }

  .rule{
    width:64px; height:1px;
    background:linear-gradient(90deg, transparent, var(--army-glow), transparent);
    margin:1.8rem auto 0;
  }

  main{
    position:relative; z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:1rem 1rem 5rem;
  }

  #book-container{
    width:100%;
    max-width:1000px;
    display:flex;
    justify-content:center;
    touch-action: pan-y;
  }

  .page{
    background:#111 no-repeat center/cover;
  }

  .page img{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:1.4rem;
    margin-top:2rem;
    font-family:'Futura','Century Gothic',sans-serif;
  }

  .ctrl-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    width:46px; height:46px;
    border-radius:50%;
    cursor:pointer;
    font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;
    transition:border-color 0.2s, color 0.2s, transform 0.15s;
  }
  .ctrl-btn:hover{ border-color:var(--army-glow); color:var(--army-glow); }
  .ctrl-btn:active{ transform:scale(0.94); }
  .ctrl-btn:focus-visible{ outline:2px solid var(--army-glow); outline-offset:2px; }

  #page-indicator{
    font-size:0.8rem;
    letter-spacing:0.1em;
    color:var(--ink-dim);
    min-width:88px;
    text-align:center;
  }

  .hint{
    margin-top:1.1rem;
    font-family:'Futura','Century Gothic',sans-serif;
    font-size:0.72rem;
    letter-spacing:0.06em;
    color:rgba(185,179,207,0.55);
  }

  footer{
    position:relative; z-index:1;
    text-align:center;
    padding:2.5rem 1.5rem 3.5rem;
    font-family:'Futura','Century Gothic',sans-serif;
    font-size:0.72rem;
    letter-spacing:0.06em;
    color:rgba(185,179,207,0.5);
    border-top:1px solid var(--line);
    margin-top:1rem;
  }

  footer a{ color:var(--army-glow); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; }
  }

  @media (max-width:600px){
    header{ padding:3rem 1rem 1.5rem; }
    .controls{ gap:1rem; }
  }
</style>

<body>

<div class="stars"></div>

  <svg viewBox="0 0 1904 803" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">

      <path id="spark" d="M0,-9 C1.2,-2 2,-1.2 9,0 C2,1.2 1.2,2 0,9 C-1.2,2 -2,1.2 -9,0 C-2,-1.2 -1.2,-2 0,-9 Z" fill="#ffffff"/>

<script src="js/page-flip.browser.js"></script>
<script>
  const TOTAL_PAGES = 46;
  const container = document.getElementById('book-container');
  const indicator = document.getElementById('page-indicator');

  // Build page elements
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    const num = String(i).padStart(2, '0');
    const pageDiv = document.createElement('div');
    pageDiv.className = 'page';
    const img = document.createElement('img');
    img.src = `images/page-${num}.jpg`;
    img.alt = `Pagina ${i}`;
    img.draggable = false;
    pageDiv.appendChild(img);
    container.appendChild(pageDiv);
  }

  // --- suono di sfogliare pagina ---
  const flipAudio = new Audio('../audio/page-flip.mp3');
  function playFlipSound() {
    const sound = flipAudio.cloneNode();
    sound.volume = 1.0;
    sound.play().catch(() => {});
  }

  const isMobile = window.innerWidth < 700;

  const pageFlip = new St.PageFlip(container, {
    width: 550,
    height: 778,
    size: 'stretch',
    minWidth: 280,
    maxWidth: 900,
    minHeight: 396,
    maxHeight: 1273,
    maxShadowOpacity: 0.5,
    showCover: true,
    mobileScrollSupport: true,
    usePortrait: isMobile,
    autoSize: true,
    flippingTime: 700
  });

  pageFlip.loadFromHTML(document.querySelectorAll('.page'));

  function updateIndicator() {
    const current = pageFlip.getCurrentPageIndex() + 1;
    indicator.textContent = `${current} / ${TOTAL_PAGES}`;
  }

  pageFlip.on('flip', () => {
    updateIndicator();
    playFlipSound();
  });
  updateIndicator();

  document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
  document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') pageFlip.flipPrev();
    if (e.key === 'ArrowRight') pageFlip.flipNext();
  });
</script>
